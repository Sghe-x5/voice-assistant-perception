name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  code-and-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q src scripts tests pilot review_stats review_text
